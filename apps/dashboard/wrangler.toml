name = "musteri-avcisi-dashboard"
main = "src/index.ts"
compatibility_date = "2024-11-01"

# apps/control API'sine servis binding'i ile bağlanır.
[[services]]
binding = "CONTROL_WORKER"
service = "musteri-avcisi-control"

[vars]
# Basit Basic Auth koruması - GERÇEK KULLANIMDA yeterli değildir.
# Üretimde Cloudflare Access (Zero Trust) ile önüne erişim kontrolü
# konması önerilir; bu sadece iskelet aşamasında minimum bir engel.
DASHBOARD_USERNAME = "admin"

# DASHBOARD_PASSWORD repoda PLAINTEXT tutulmaz -
# `wrangler secret put DASHBOARD_PASSWORD` ile ayarlanmalı.

# apps/control'e her istekte x-control-secret header'ı olarak gönderilir -
# control bu değer eşleşmeden hiçbir aday/istatistik isteğine yanıt
# vermiyor (bkz. apps/control/src/index.ts requireControlSecret).
# apps/control'deki CONTROL_SHARED_SECRET ile AYNI değer olmalı. Repoda
# PLAINTEXT tutulmaz - `wrangler secret put CONTROL_SHARED_SECRET` ile
# ayarlanmalı.
