name = "musteri-avcisi-control"
main = "src/index.ts"
compatibility_date = "2024-11-01"

# Merkezi veritabani - gercek Cloudflare hesabinda `wrangler d1 create`
# ile olusturulup asagidaki database_id doldurulmali.
[[d1_databases]]
binding = "DB"
database_name = "musteri-avcisi-db"
database_id = "a66a7c79-aa21-4346-8ec0-550241d27849"

# Onaylanan adaylarin gonderim kanallarina dispatch edilmesi icin kuyruk.
[[queues.producers]]
binding = "OUTREACH_QUEUE"
queue = "musteri-avcisi-outreach"

[[queues.consumers]]
queue = "musteri-avcisi-outreach"
max_batch_size = 10
max_retries = 3

# Gonderim kanali worker'larina servis baglantilari (whatsapp/email).
# Once workers/channels/* deploy edilmeli, sonra bu binding'ler aktif olur.
[[services]]
binding = "WHATSAPP_WORKER"
service = "musteri-avcisi-channel-whatsapp"

[[services]]
binding = "EMAIL_WORKER"
service = "musteri-avcisi-channel-email"

# Tarama worker'larinin control API'ye yazarken kullandigi paylasilan sir.
# Repoda PLAINTEXT tutulmaz - `wrangler secret put SCAN_SHARED_SECRET` ile
# ayarlanmali (ayni deger her tarama worker'inda da secret olarak set edilmeli).

# Teklif metinlerini kisisellestirmek icin NVIDIA API (integrate.api.nvidia.com).
# Tanimli degilse basit sablon metne dusulur, hata vermez.
# `wrangler secret put NVIDIA_API_KEY` ile eklenmeli.
#
# Istege bagli: NVIDIA_MODEL (var, secret degil) - build.nvidia.com'daki
# model kimligi, tanimli degilse "meta/llama-3.1-70b-instruct" kullanilir.
# [vars]
# NVIDIA_MODEL = "meta/llama-3.1-70b-instruct"
