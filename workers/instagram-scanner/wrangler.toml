name = "musteri-avcisi-instagram-scanner"
main = "src/index.ts"
compatibility_date = "2024-11-01"

# BAŞLANGIÇTA PASİF - bkz. packages/shared/src/config.ts activeSourceChannels.
[triggers]
crons = ["*/30 * * * *"]

[[kv_namespaces]]
binding = "SCAN_STATE"
id = "REPLACE_WITH_REAL_KV_NAMESPACE_ID"

[vars]
CONTROL_API_URL = "https://musteri-avcisi-control.<ACCOUNT>.workers.dev"
SCAN_SHARED_SECRET = "dev-only-change-me"

# Instagram Graph API (işletme hesabı gerektirir) ya da üçüncü parti
# tarama servisi - `wrangler secret put INSTAGRAM_API_KEY` ile eklenmeli.
