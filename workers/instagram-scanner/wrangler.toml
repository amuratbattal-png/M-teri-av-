name = "musteri-avcisi-instagram-scanner"
main = "src/index.ts"
compatibility_date = "2024-11-01"

# BAŞLANGIÇTA PASİF - bkz. packages/shared/src/config.ts activeSourceChannels.
[triggers]
crons = ["*/30 * * * *"]

[[kv_namespaces]]
binding = "SCAN_STATE"
id = "6771fce3d88c4a80a47cdeaf96803023"

# Control'e servis binding'i ile bağlanır (workers.dev üzerinden düz
# fetch() ile worker-to-worker istek Cloudflare tarafından engelleniyor -
# "error 1042" - bu yüzden CONTROL_API_URL yerine service binding kullanılır).
[[services]]
binding = "CONTROL_WORKER"
service = "musteri-avcisi-control"

[vars]
# SCAN_SHARED_SECRET repoda PLAINTEXT tutulmaz -
# `wrangler secret put SCAN_SHARED_SECRET` ile ayarlanmalı (apps/control
# ile AYNI değer).

# Karar verildi (bkz. CLAUDE.md): Instagram'ın resmi Graph API'si rastgele
# hashtag taramasına izin vermiyor - sadece sahibinin yönettiği hesap için
# çalışıyor. Bu yüzden LinkedIn'deki (Voyager) yöntemle AYNI mantık:
# oturum tabanlı erişim (INSTAGRAM_SESSION_COOKIE + INSTAGRAM_CSRF_TOKEN,
# dokümante edilmemiş "tags/web_info" iç API'si) kullanılıyor - kullanım
# şartlarına aykırı olabilir, hesap kısıtlanma/askıya alınma riski
# LinkedIn'e göre DAHA YÜKSEK kabul edildi; sahibi bu riski bilerek kabul
# etti. Bu iki değer `wrangler secret put` İLE DEĞİL, Ayarlar panelinden
# (Cloudflare secret yerine D1'de) girilecek şekilde tasarlandı - bkz.
# apps/control/src/lib/settings-catalog.ts.
