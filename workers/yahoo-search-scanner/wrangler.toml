name = "musteri-avcisi-yahoo-search-scanner"
main = "src/index.ts"
compatibility_date = "2024-11-01"

# BAŞLANGIÇTA PASİF - bkz. packages/shared/src/config.ts activeSourceChannels.
# google-search-scanner ile aynı sektör listesini, ayrı bir cursor ile tarar.
[triggers]
crons = ["*/30 * * * *"]

[[kv_namespaces]]
binding = "SCAN_STATE"
id = "fd3fd138629647e0ae85690947cb8a5f"

[vars]
CONTROL_API_URL = "https://musteri-avcisi-control.alimuratbattal.workers.dev"
# SCAN_SHARED_SECRET repoda PLAINTEXT tutulmaz -
# `wrangler secret put SCAN_SHARED_SECRET` ile ayarlanmalı (apps/control
# ile AYNI değer).

# `wrangler secret put YAHOO_SEARCH_API_KEY` ile eklenmeli.
