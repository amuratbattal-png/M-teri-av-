name = "musteri-avcisi-company-formation-tracker"
main = "src/index.ts"
compatibility_date = "2024-11-01"

# Alfabetik sektor taramasindan BAGIMSIZ, paralel calisan iş kolu.
# Sık calisir cunku "yeni kurulan sirket" sinyali zamana duyarli.
[triggers]
crons = ["*/15 * * * *"]

[vars]
CONTROL_API_URL = "https://musteri-avcisi-control.<ACCOUNT>.workers.dev"
# SCAN_SHARED_SECRET repoda PLAINTEXT tutulmaz -
# `wrangler secret put SCAN_SHARED_SECRET` ile ayarlanmalı (apps/control
# ile AYNI değer).

