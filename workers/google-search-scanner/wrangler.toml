name = "musteri-avcisi-google-search-scanner"
main = "src/index.ts"
compatibility_date = "2024-11-01"

# Her 30 dakikada bir tetiklenir; her calismada sirali sektor listesinden
# bir sonraki sektoru tarar (bkz. src/scan.ts).
[triggers]
crons = ["*/30 * * * *"]

# Bu worker'ın kendi tarama ilerlemesini (hangi sektörde kaldığı) tuttuğu KV.
[[kv_namespaces]]
binding = "SCAN_STATE"
id = "d0985dc320d847ff8b3ecf13d4f37b26"

# Control'e servis binding'i ile bağlanır (workers.dev üzerinden düz
# fetch() ile worker-to-worker istek Cloudflare tarafından engelleniyor -
# "error 1042" - bu yüzden CONTROL_API_URL yerine service binding kullanılır).
[[services]]
binding = "CONTROL_WORKER"
service = "musteri-avcisi-control"

[vars]
# SCAN_SHARED_SECRET repoda PLAINTEXT tutulmaz -
# `wrangler secret put SCAN_SHARED_SECRET` ile ayarlanmalı (apps/control
# ile AYNI değer).

# Gercek arama/scraping icin API anahtari (Google Places API - google_maps
# kanali). `wrangler secret put SEARCH_API_KEY` ile eklenmeli. Eklenene
# kadar scan() fonksiyonu sahte (stub) veri dondurur.

# Duz web aramasi (brave_search kanali) icin Brave Search API anahtari.
# Bos birakilirsa sadece Google Maps (Places API) taranir, duz web
# aramasi atlanir.
#
# NOT: Bu kanal onceden Google Custom Search JSON API kullaniyordu, ama
# projeye ozel, cozulemeyen kalici bir 403 hatasi ("This project does
# not have the access to Custom Search JSON API") yuzunden Brave Search
# API'ye gecildi - API restriction, proje eslesmesi, billing, birden
# fazla farkli/yeni anahtar ve API'yi kapatip acmak denendi, hicbiri
# cozmedi (hatta Cloudflare disinda dogrudan test edilince de ayni
# sonuc alindi). Brave Search API anahtari brave.com/search/api adresinden
# alinip `wrangler secret put BRAVE_API_KEY` ile eklenmeli - ucretsiz
# katmani var, gizli oldugu icin var degil secret.
